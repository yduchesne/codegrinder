[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codegrinder"
version = "0.1.0"
description = "Deterministic, roadmap-driven Codex/Pi coding workflow orchestration"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "Codegrinder contributors"}]
dependencies = []

[project.scripts]
grind = "codegrinder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.13",
    "mypy>=1.18",
    "pre-commit==4.7.0",
    "bandit==1.9.4",
    "semgrep==1.185.0",
    "cyclonedx-bom==8.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codegrinder = ["schemas/*.json", "prompts/*/*.prompt.txt", "prompts/*/*/*.prompt.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=codegrinder --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["codegrinder"]

[tool.coverage.report]
show_missing = true
fail_under = 85
precision = 2
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__."]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.14"
files = ["src/codegrinder"]
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false
