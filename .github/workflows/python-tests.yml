name: Python quality
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install Python and project dependencies
        run: uv sync --group dev
      - name: Verify the installed CLI
        run: |
          uv run --no-sync grind --help
          uv run --no-sync grind run --help
      - name: Ruff lint
        run: uv run --no-sync ruff check src tests
      - name: mypy static analysis
        run: uv run --no-sync mypy src/codegrinder
      - name: Unit tests and 85 percent minimum coverage
        run: uv run --no-sync pytest
